name: Publish release ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sodium
          coverage: none

      - name: Validate PHP and result storage
        shell: bash
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          for test_file in tests/*-test.php; do
            php "$test_file"
          done

      - name: Install production email dependency
        shell: bash
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build ZIP
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="SecureDice-$VERSION.zip"
          zip -r "$ARCHIVE" . \
            -x '.git/*' \
               '.github/*' \
               '.githooks/*' \
               'dist/*' \
               '*.zip'
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"

          # A release can survive after its Git tag has been deleted. GitHub
          # refuses to modify such a published release, so remove the stale
          # release and recreate it below.
          if gh release view "$TAG" >/dev/null 2>&1 && ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists without a valid tag; recreating it."
            gh release delete "$TAG" --yes
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --target "$GITHUB_SHA" \
              --title "Secure Dice $VERSION" \
              --generate-notes
          fi
