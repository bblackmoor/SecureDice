name: Build package

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Name package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED_TAG="v$VERSION"
            if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION" >&2
              exit 1
            fi
            NAME="SecureDice-$VERSION"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            NAME="SecureDice-$VERSION-dev-$SHORT_SHA"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sodium
          coverage: none

      - name: Validate PHP and result storage
        shell: bash
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          for test_file in tests/*-test.php; do
            php "$test_file"
          done

      - name: Install production email dependency
        shell: bash
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build ZIP
        shell: bash
        run: |
          mkdir -p dist
          ARCHIVE="dist/${{ steps.package.outputs.name }}.zip"
          zip -r "$ARCHIVE" . \
            -x '.git/*' \
               '.github/*' \
               '.githooks/*' \
               'dist/*' \
               '*.zip'
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Store development build for 90 days
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.zip
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v$VERSION"

          # A release can survive after its Git tag has been deleted. GitHub
          # refuses to modify such a published release, so remove the stale
          # release and recreate it below.
          if gh release view "$TAG" >/dev/null 2>&1 && ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists without a valid tag; recreating it."
            gh release delete "$TAG" --yes
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --title "Secure Dice $VERSION" \
              --generate-notes
          fi

      - name: Remove superseded release entries
        if: github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Separate development and release packages'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            while IFS= read -r TAG; do
              if [ "$TAG" != "v2.0.49" ]; then
                gh release delete "$TAG" --yes
              fi
            done
